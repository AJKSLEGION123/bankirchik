<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="100%" stop-color="#FFE680"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE680"/>
      <stop offset="100%" stop-color="#FFC21A"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFC21A" stroke-width="16"/>

  <!-- Hamster Ears -->
  <circle cx="170" cy="190" r="50" fill="#E89758"/>
  <circle cx="170" cy="190" r="30" fill="#FFA6B5"/>
  <circle cx="342" cy="190" r="50" fill="#E89758"/>
  <circle cx="342" cy="190" r="30" fill="#FFA6B5"/>

  <!-- Hamster Head -->
  <ellipse cx="256" cy="270" rx="140" ry="120" fill="#F4A261"/>
  <!-- Cheeks -->
  <ellipse cx="160" cy="310" rx="45" ry="35" fill="#FFE0B2"/>
  <ellipse cx="352" cy="310" rx="45" ry="35" fill="#FFE0B2"/>
  <circle cx="175" cy="315" r="16" fill="#FFA6B5" opacity="0.6"/>
  <circle cx="337" cy="315" r="16" fill="#FFA6B5" opacity="0.6"/>

  <!-- Eyes -->
  <circle cx="205" cy="250" r="18" fill="#3B1F0E"/>
  <circle cx="211" cy="244" r="6" fill="#FFFFFF"/>
  <circle cx="307" cy="250" r="18" fill="#3B1F0E"/>
  <circle cx="313" cy="244" r="6" fill="#FFFFFF"/>

  <!-- Nose & Mouth -->
  <polygon points="256,285 246,275 266,275" fill="#E63946"/>
  <path d="M 246,285 Q 240,298 256,305 Q 272,298 266,285" fill="none" stroke="#3B1F0E" stroke-width="4" stroke-linecap="round"/>

  <!-- Red Scarf -->
  <path d="M 160,360 Q 256,410 352,360 L 360,395 Q 256,445 152,395 Z" fill="#E63946"/>
  <path d="M 290,385 L 320,470 L 350,460 L 320,380 Z" fill="#A61B25"/>

  <!-- Gold Coin in Front -->
  <circle cx="256" cy="400" r="60" fill="url(#coinGrad)" stroke="#EAC54F" stroke-width="6"/>
  <text x="256" y="424" font-family="Nunito, sans-serif" font-weight="900" font-size="64" fill="#A61B25" text-anchor="middle">Б</text>
</svg>
